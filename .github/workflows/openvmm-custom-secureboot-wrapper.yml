name: Exact OpenVMM custom Secure Boot VMGS integration wrapper

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/openvmm-custom-secureboot-wrapper.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install workflow parser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input pyyaml

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Fetch commit-pinned owned integration definition
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/zerodaybugs/test/52aea2f9a8f23590c14313dfb6e0fa9c9d999444/.github/workflows/openvmm-custom-secureboot-vmgs-integration.yml'
          curl --fail --location --retry 5 --retry-all-errors -o pinned-integration.yml "$url"
          sha256sum pinned-integration.yml | tee pinned-integration.sha256
          grep -F 'name: Exact OpenVMM custom Secure Boot VMGS integration' pinned-integration.yml

      - name: Convert pinned run blocks into isolated local steps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYGEN'
          from pathlib import Path
          import shlex
          from textwrap import dedent
          import yaml

          doc = yaml.safe_load(Path('pinned-integration.yml').read_text(encoding='utf-8'))
          steps = doc['jobs']['integration']['steps']
          out = ['#!/usr/bin/env bash', 'set -e']
          selected = 0
          for step in steps:
              run = step.get('run')
              if not run:
                  continue
              shell = step.get('shell', 'bash')
              if shell not in ('bash', None):
                  raise SystemExit(f'unsupported inline shell: {shell}')
              name = step.get('name', f'step-{selected + 1}')
              out.extend([
                  '',
                  '(',
                  'cd "$GITHUB_WORKSPACE"',
                  f'echo {shlex.quote("===== " + name + " =====")}',
              ])
              out.extend(run.splitlines())
              out.append(')')
              selected += 1
          if selected < 8:
              raise SystemExit(f'unexpected run-block count: {selected}')

          script = '\n'.join(out) + '\n'
          patch_start = "python - <<'PY'\nfrom pathlib import Path\n\npath = Path('flowey/flowey_lib_hvlite/src/build_guest_test_uefi.rs')"
          patch_end = "\nPY\n\ncat >> vm/devices/firmware/firmware_uefi/src/service/nvram/mod.rs <<'RS'"
          start = script.index(patch_start)
          end = script.index(patch_end, start) + len("\nPY")
          robust_patch = dedent(r'''
          python - <<'PY'
          from pathlib import Path

          path = Path('flowey/flowey_lib_hvlite/src/build_guest_test_uefi.rs')
          text = path.read_text(encoding='utf-8')
          old_token = 'let (efi, pdb) = match rt.read(output) {'
          new_token = 'let (mut efi, pdb) = match rt.read(output) {'
          if text.count(old_token) != 1:
              raise SystemExit(f'unexpected signing source anchor count: {text.count(old_token)}')
          text = text.replace(old_token, new_token, 1)
          marker = '                    // package it up into an img using the xtask'
          if text.count(marker) != 1:
              raise SystemExit(f'unexpected packaging marker count: {text.count(marker)}')
          block = '\n'.join([
              '                    if let (Some(key), Some(cert)) = (',
              '                        std::env::var_os("CUSTOM_SB_KEY"),',
              '                        std::env::var_os("CUSTOM_SB_CERT"),',
              '                    ) {',
              '                        let key = PathBuf::from(key);',
              '                        let cert = PathBuf::from(cert);',
              '                        let signed_efi = rt.sh.current_dir().join("guest_test_uefi.signed.efi");',
              '                        flowey::shell_cmd!(',
              '                            rt,',
              '                            "sbsign --key {key} --cert {cert} --output {signed_efi} {efi}"',
              '                        )',
              '                        .run()?;',
              '                        efi = signed_efi;',
              '                    }',
          ])
          path.write_text(text.replace(marker, block + '\n\n' + marker, 1), encoding='utf-8')
          PY
          ''').strip('\n')
          script = script[:start] + robust_patch + script[end:]

          test_marker = "cat >> vmm_tests/vmm_tests/tests/tests/multiarch/vmgs.rs <<'RS'"
          if script.count(test_marker) != 1:
              raise SystemExit(f'unexpected VMGS test marker count: {script.count(test_marker)}')
          builder_patch = dedent(r'''
          cat >> petri/src/vm/mod.rs <<'RS'

          impl<T: PetriVmmBackend> PetriVmBuilder<T> {
              /// Enable UEFI Secure Boot while preserving an already-populated
              /// persistent NVRAM trust database supplied through VMGS.
              pub fn with_secure_boot_enabled_without_template(mut self) -> Self {
                  let config = self
                      .config
                      .firmware
                      .uefi_config_mut()
                      .expect("Secure boot is only supported for UEFI firmware.");
                  config.secure_boot_enabled = true;
                  config.secure_boot_template = None;
                  self
              }
          }
          RS

          ''').strip('\n') + '\n\n'
          script = script.replace(test_marker, builder_patch + test_marker, 1)
          template_call = '.with_windows_secure_boot_template()'
          if script.count(template_call) != 1:
              raise SystemExit(f'unexpected Secure Boot template call count: {script.count(template_call)}')
          script = script.replace(
              template_call,
              '.with_secure_boot_enabled_without_template()',
              1,
          )

          old_filter = "--filter 'test(custom_secure_boot_vmgs_guest)'"
          exact_filter = "--filter 'test(/^openvmm_openhcl_uefi_x64_guest_test_x64_custom_secure_boot_vmgs_guest$/)'"
          if script.count(old_filter) != 1:
              raise SystemExit(f'unexpected custom test filter count: {script.count(old_filter)}')
          script = script.replace(old_filter, exact_filter, 1)

          Path('execute-pinned-integration.sh').write_text(script, encoding='utf-8')
          print(f'run_blocks={selected}')
          PYGEN
          chmod +x execute-pinned-integration.sh
          bash -n execute-pinned-integration.sh
          sha256sum execute-pinned-integration.sh | tee execute-pinned-integration.sha256

      - name: Execute exact integration
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./execute-pinned-integration.sh 2>&1 | tee wrapper-execution.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "return_code=$rc" | tee wrapper-execution-status.txt
          exit "$rc"

      - name: Upload auditable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-openvmm-custom-secureboot-wrapper
          path: |
            pinned-integration.yml
            pinned-integration.sha256
            execute-pinned-integration.sh
            execute-pinned-integration.sha256
            wrapper-execution.log
            wrapper-execution-status.txt
            runner-baseline.txt
            source-commit.txt
            MSVM.fd.sha256
            protoc-version.txt
            restore-packages.log
            secure-boot-cert-metadata.txt
            secure-boot-cert-der.sha256
            test-only-diff-stat.txt
            nvram-export-test.log
            custom-secure-boot-nvram.sha256
            vmgstool-build.log
            nvram-dump.txt
            vmgs-headers.txt
            custom-secure-boot.vmgs.sha256
            custom-secure-boot-integration.log
            custom-secure-boot-integration-status.txt
          retention-days: 7
