name: Public 0x active-prev bool regression gate

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/public-0x-prev-bool-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: feature234-prev
            ref: 340ffbb23734843f6a569ba14360e9088009cc8c
          - label: feature5-prev
            ref: 111afe09957db8d0d895c6df64ee4c97077ef450
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout old production source
        uses: actions/checkout@v4
        with:
          repository: 0xProject/0x-settler
          ref: ${{ matrix.ref }}
          submodules: recursive
          fetch-depth: 1
          path: old
          persist-credentials: false
      - name: Checkout latest public regression tests
        uses: actions/checkout@v4
        with:
          repository: 0xProject/0x-settler
          ref: 2bad36e7a9dc9660f52c7756d54ae7627f82e0f9
          submodules: false
          fetch-depth: 1
          path: latest
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Backport and run BoolBoundary regressions
        shell: bash
        run: |
          set -o pipefail
          OUT="$GITHUB_WORKSPACE/bool-regression-${{ matrix.label }}"
          mkdir -p "$OUT"
          cp latest/test/0.8.25/BoolBoundary.t.sol old/test/0.8.25/BoolBoundary.latest.t.sol
          cd old
          git rev-parse HEAD > "$OUT/SOURCE_COMMIT.txt"
          cp test/0.8.25/BoolBoundary.latest.t.sol "$OUT/"
          forge test --match-path 'test/0.8.25/BoolBoundary.latest.t.sol' -vvv 2>&1 | tee "$OUT/FORGE_TEST_FULL.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$OUT/FORGE_EXIT_CODE.txt"
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 0x-bool-regression-${{ matrix.label }}-${{ github.run_id }}
          path: bool-regression-${{ matrix.label }}/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 9
