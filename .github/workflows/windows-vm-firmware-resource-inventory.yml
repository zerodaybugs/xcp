name: Windows VM firmware resource inventory

on:
  push:
    branches:
      - openhcl-lab-20260818
    paths:
      - .github/workflows/windows-vm-firmware-resource-inventory.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/windows-vm-firmware-resource-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Install PE parser
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input pefile

      - name: Collect signed firmware resource metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          @'
          import hashlib
          import json
          import pathlib
          import sys

          import pefile

          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()
          result = {"resources": [], "pe_error": None}

          def resource_name(entry):
              if entry.name is not None:
                  return str(entry.name)
              return str(entry.struct.Id)

          try:
              pe = pefile.PE(data=data, fast_load=False)
              if hasattr(pe, "DIRECTORY_ENTRY_RESOURCE"):
                  image = pe.get_memory_mapped_image()
                  for type_entry in pe.DIRECTORY_ENTRY_RESOURCE.entries:
                      type_name = resource_name(type_entry)
                      for name_entry in type_entry.directory.entries:
                          name = resource_name(name_entry)
                          for lang_entry in name_entry.directory.entries:
                              rva = int(lang_entry.data.struct.OffsetToData)
                              size = int(lang_entry.data.struct.Size)
                              blob = image[rva:rva + size]
                              result["resources"].append({
                                  "type": type_name,
                                  "name": name,
                                  "lang": int(lang_entry.struct.Id),
                                  "size": size,
                                  "sha256": hashlib.sha256(blob).hexdigest(),
                                  "igvm_magic_offsets": [
                                      i for i in range(0, max(0, len(blob) - 3))
                                      if blob[i:i + 4] == b"IGVM"
                                  ][:16],
                              })
          except Exception as exc:
              result["pe_error"] = f"{type(exc).__name__}: {exc}"

          print(json.dumps(result, separators=(",", ":")))
          '@ | Set-Content -LiteralPath parse_resources.py -Encoding UTF8

          $roots = @(
              (Join-Path $env:WINDIR 'System32'),
              (Join-Path $env:WINDIR 'WinSxS')
          )
          $candidates = foreach ($root in $roots) {
              if (Test-Path -LiteralPath $root) {
                  Get-ChildItem -LiteralPath $root -Filter 'vmfirmware*.dll' -File -Recurse -ErrorAction SilentlyContinue
              }
          }
          $candidates = @($candidates | Sort-Object FullName -Unique)

          $records = foreach ($file in $candidates) {
              $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
              $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
              $version = $file.VersionInfo
              $parsed = (python parse_resources.py $file.FullName | ConvertFrom-Json -Depth 12)

              [pscustomobject]@{
                  path_class = if ($file.FullName -like '*\System32\*') { 'System32' } else { 'WinSxS' }
                  filename = $file.Name
                  size = [int64]$file.Length
                  sha256 = $hash.Hash.ToLowerInvariant()
                  version = [pscustomobject]@{
                      FileVersion = $version.FileVersion
                      ProductVersion = $version.ProductVersion
                      CompanyName = $version.CompanyName
                      OriginalFilename = $version.OriginalFilename
                  }
                  authenticode = [pscustomobject]@{
                      Status = [string]$sig.Status
                      StatusMessage = $sig.StatusMessage
                      Signer = if ($null -ne $sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { $null }
                      Thumbprint = if ($null -ne $sig.SignerCertificate) { $sig.SignerCertificate.Thumbprint } else { $null }
                      TimestampSigner = if ($null -ne $sig.TimeStamperCertificate) { $sig.TimeStamperCertificate.Subject } else { $null }
                  }
                  resources = @($parsed.resources)
                  pe_error = $parsed.pe_error
              }
          }

          $osInfo = Get-CimInstance Win32_OperatingSystem
          $output = [ordered]@{
              schema = 'windows-vm-firmware-resource-inventory-v2'
              generated_utc = [DateTime]::UtcNow.ToString('o')
              runner_label = '${{ matrix.os }}'
              os_caption = $osInfo.Caption
              os_version = $osInfo.Version
              os_build = $osInfo.BuildNumber
              candidate_count = @($records).Count
              records = @($records)
          }
          $output | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath firmware-resource-inventory.json -Encoding UTF8

          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add("runner_label=${{ matrix.os }}")
          $summary.Add("os_caption=$($osInfo.Caption)")
          $summary.Add("os_version=$($osInfo.Version)")
          $summary.Add("os_build=$($osInfo.BuildNumber)")
          $summary.Add("candidate_count=$(@($records).Count)")
          foreach ($record in $records) {
              $resources = @($record.resources)
              $vmfw = @($resources | Where-Object { $_.type -eq 'VMFW' }).Count
              $igvm = 0
              foreach ($resource in $resources) {
                  $igvm += @($resource.igvm_magic_offsets).Count
              }
              $summary.Add(
                  "$($record.path_class) $($record.filename) version=$($record.version.FileVersion) " +
                  "sha256=$($record.sha256) auth=$($record.authenticode.Status) signer=$($record.authenticode.Signer) " +
                  "resources=$($resources.Count) vmfw=$vmfw igvm=$igvm"
              )
          }
          $summary | Set-Content -LiteralPath firmware-resource-summary.txt -Encoding UTF8
          Get-Content firmware-resource-summary.txt

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: windows-vm-firmware-resource-inventory-${{ matrix.os }}
          path: |
            firmware-resource-inventory.json
            firmware-resource-summary.txt
          retention-days: 7
