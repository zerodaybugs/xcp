name: Collect public Permit2 allowance state

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/public-permit2-allowance-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ethereum:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query exact Permit2 events targeting AllowanceHolder
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/permit2-state"
          mkdir -p "$OUT"
          BASE='https://eth.blockscout.com/api?module=logs&action=getLogs&fromBlock=0&toBlock=latest&address=0x000000000022d473030f116ddee9f6b43ac78ba3&topic3=0x000000000000000000000000000000000000000000001ff3684f28c67538d4d072c22734&topic0_3_opr=and&page=1&offset=1000'
          APPROVAL="$BASE&topic0=0xda9fa7c1b00402c17d0161b249b1ab8bbec047c5a52207b9c112deffd817036b"
          PERMIT="$BASE&topic0=0xc6a377bfc4eb120024a8ac08eef205be16b817020812c73223e81d1bdb9708ec"
          printf '%s\n' "$APPROVAL" > "$OUT/approval-query-url.txt"
          printf '%s\n' "$PERMIT" > "$OUT/permit-query-url.txt"
          curl -fsSL --retry 5 --retry-all-errors --max-time 120 "$APPROVAL" > "$OUT/approval-raw.json"
          curl -fsSL --retry 5 --retry-all-errors --max-time 120 "$PERMIT" > "$OUT/permit-raw.json"
          python3 - "$OUT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          summary = {}
          for kind in ('approval', 'permit'):
              obj = json.loads((root / f'{kind}-raw.json').read_text())
              result = obj.get('result', []) if isinstance(obj, dict) else []
              if isinstance(result, str):
                  rows = [] if 'no logs' in result.lower() or 'no records' in result.lower() else None
              elif isinstance(result, list):
                  rows = result
              else:
                  rows = None
              if rows is None:
                  raise SystemExit(f'{kind}: unexpected Blockscout response: {obj!r}')
              summary[kind] = {
                  'status': obj.get('status'),
                  'message': obj.get('message'),
                  'event_count': len(rows),
                  'events': rows,
              }
          summary['total_event_count'] = sum(summary[k]['event_count'] for k in ('approval', 'permit'))
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'approval_events': summary['approval']['event_count'],
              'permit_events': summary['permit']['event_count'],
              'total': summary['total_event_count'],
          }, sort_keys=True))
          PY
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test -s "$OUT/summary.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-permit2-allowance-state-${{ github.run_id }}
          path: permit2-state/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 9
