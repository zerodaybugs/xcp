name: Collect public Permit2 allowance state

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/public-permit2-allowance-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - {shard: '00', start: 19500000, end: 19887499}
          - {shard: '01', start: 19887500, end: 20274999}
          - {shard: '02', start: 20275000, end: 20662499}
          - {shard: '03', start: 20662500, end: 21049999}
          - {shard: '04', start: 21050000, end: 21437499}
          - {shard: '05', start: 21437500, end: 21824999}
          - {shard: '06', start: 21825000, end: 22212499}
          - {shard: '07', start: 22212500, end: 22599999}
          - {shard: '08', start: 22600000, end: 22987499}
          - {shard: '09', start: 22987500, end: 23374999}
          - {shard: '10', start: 23375000, end: 23762499}
          - {shard: '11', start: 23762500, end: 24149999}
          - {shard: '12', start: 24150000, end: 24537499}
          - {shard: '13', start: 24537500, end: 24924999}
          - {shard: '14', start: 24925000, end: 25312499}
          - {shard: '15', start: 25312500, end: 25699999}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Scan exact Permit2 events for AllowanceHolder
        env:
          SHARD: ${{ matrix.shard }}
          START_BLOCK: ${{ matrix.start }}
          END_BLOCK: ${{ matrix.end }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/permit2-state-$SHARD"
          mkdir -p "$OUT"
          python3 - "$OUT" <<'PY'
          import json, os, pathlib, sys, time, urllib.request

          out = pathlib.Path(sys.argv[1])
          shard = os.environ['SHARD']
          start = int(os.environ['START_BLOCK'])
          configured_end = int(os.environ['END_BLOCK'])
          permit2 = '0x000000000022d473030f116ddee9f6b43ac78ba3'
          spender = '0x0000000000001ff3684f28c67538d4d072c22734'
          spender_topic = '0x' + '0' * 24 + spender[2:]
          approval_topic = '0xda9fa7c1b00402c17d0161b249b1ab8bbec047c5a52207b9c112deffd817036b'
          permit_topic = '0xc6a377bfc4eb120024a8ac08eef205be16b817020812c73223e81d1bdb9708ec'
          rpcs = [
              'https://ethereum-rpc.publicnode.com',
              'https://eth.drpc.org',
              'https://eth.llamarpc.com',
          ]
          rid = 0

          def one_rpc(url, method, params, timeout=45):
              global rid
              rid += 1
              body = json.dumps({'jsonrpc':'2.0','id':rid,'method':method,'params':params}).encode()
              req = urllib.request.Request(
                  url, data=body,
                  headers={'Content-Type':'application/json','User-Agent':'0x-public-state-scan/2.0'},
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  obj = json.load(response)
              if 'error' in obj:
                  raise RuntimeError(obj['error'])
              return obj['result']

          def rpc(method, params, attempts=5):
              errors = []
              for attempt in range(attempts):
                  url = rpcs[(attempt + int(shard)) % len(rpcs)]
                  try:
                      return one_rpc(url, method, params), url
                  except Exception as exc:
                      errors.append({'rpc':url,'error':repr(exc)})
                      time.sleep(min(6, 1 + attempt))
              raise RuntimeError({'method':method,'errors':errors})

          head_raw, head_rpc = rpc('eth_blockNumber', [])
          head = int(head_raw, 16)
          latest_block, _ = rpc('eth_getBlockByNumber', ['latest', False])
          now = int(latest_block['timestamp'], 16)
          end = min(configured_end, head)

          logs = []
          ranges = []
          cursor = start
          chunk = 10_000
          while cursor <= end:
              stop = min(end, cursor + chunk - 1)
              query = {
                  'fromBlock':hex(cursor),
                  'toBlock':hex(stop),
                  'address':permit2,
                  'topics':[[approval_topic, permit_topic], None, None, spender_topic],
              }
              try:
                  batch, used_rpc = rpc('eth_getLogs', [query], attempts=6)
              except Exception:
                  if chunk > 1_000:
                      chunk //= 2
                      continue
                  raise
              logs.extend(batch)
              ranges.append({'from':cursor,'to':stop,'count':len(batch),'rpc':used_rpc})
              cursor = stop + 1
              if not batch and chunk < 25_000:
                  chunk = min(25_000, chunk * 2)

          def addr(topic): return '0x' + topic[-40:].lower()
          def word(address): return '0' * 24 + address[2:].lower()
          def eth_call(to, data):
              try:
                  return rpc('eth_call', [{'to':to,'data':data}, 'latest'], attempts=5)[0]
              except Exception as exc:
                  return {'error':repr(exc)}
          def uint_call(to, data):
              raw = eth_call(to, data)
              if isinstance(raw, dict): return None, raw
              try: return int(raw,16), raw
              except Exception: return None, raw

          events = []
          for log in logs:
              topics = log.get('topics', [])
              if len(topics) < 4:
                  continue
              data = log.get('data','0x')[2:]
              words = [int(data[i:i+64] or '0',16) for i in range(0,len(data),64)]
              events.append({
                  'kind':'Approval' if topics[0].lower() == approval_topic else 'Permit',
                  'owner':addr(topics[1]),
                  'token':addr(topics[2]),
                  'spender':addr(topics[3]),
                  'event_amount':words[0] if words else None,
                  'event_expiration':words[1] if len(words)>1 else None,
                  'event_nonce':words[2] if len(words)>2 else None,
                  'block':int(log['blockNumber'],16),
                  'tx_hash':log.get('transactionHash'),
                  'log_index':int(log.get('logIndex','0x0'),16),
              })
          events.sort(key=lambda x:(x['block'],x['log_index']))
          latest = {}
          for event in events:
              latest[(event['owner'],event['token'])] = event

          checked = []
          active = []
          for (owner, token), event in sorted(latest.items()):
              allowance_raw = eth_call(permit2, '0x927da105' + word(owner) + word(token) + word(spender))
              amount = expiration = nonce = None
              if isinstance(allowance_raw,str) and allowance_raw.startswith('0x') and len(allowance_raw) >= 194:
                  amount = int(allowance_raw[2:66],16)
                  expiration = int(allowance_raw[66:130],16)
                  nonce = int(allowance_raw[130:194],16)
              balance, balance_raw = uint_call(token, '0x70a08231' + word(owner))
              token_to_permit2, token_to_permit2_raw = uint_call(
                  token, '0xdd62ed3e' + word(owner) + word(permit2)
              )
              effective = None
              if None not in (amount,balance,token_to_permit2):
                  effective = min(amount,balance,token_to_permit2)
              row = {
                  **event,
                  'amount_now':amount,
                  'expiration_now':expiration,
                  'nonce_now':nonce,
                  'not_expired':expiration is not None and now <= expiration,
                  'owner_token_balance':balance,
                  'owner_erc20_allowance_to_permit2':token_to_permit2,
                  'effective_stealable_now':effective,
                  'allowance_raw':allowance_raw,
                  'balance_raw':balance_raw,
                  'erc20_allowance_raw':token_to_permit2_raw,
              }
              checked.append(row)
              if row['not_expired'] and effective not in (None,0):
                  active.append(row)

          summary = {
              'shard':shard,
              'configured_start':start,
              'configured_end':configured_end,
              'scanned_end':end,
              'head':head,
              'head_rpc':head_rpc,
              'timestamp':now,
              'range_count':len(ranges),
              'event_count':len(events),
              'unique_owner_token_pairs':len(latest),
              'active_exploitable_pair_count':len(active),
              'active_exploitable_pairs':active,
          }
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (out/'events.json').write_text(json.dumps(events,indent=2,sort_keys=True)+'\n')
          (out/'checked-pairs.json').write_text(json.dumps(checked,indent=2,sort_keys=True)+'\n')
          (out/'ranges.json').write_text(json.dumps(ranges,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'shard':shard,
              'events':len(events),
              'active':len(active),
              'scanned':[start,end],
          }, sort_keys=True))
          PY
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test -s "$OUT/summary.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permit2-allowanceholder-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: permit2-state-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 9
