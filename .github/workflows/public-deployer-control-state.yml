name: Snapshot public 0x Deployer control state

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/public-deployer-control-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ethereum:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Query Deployer proxy, feature auth, and Safe state
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/deployer-control-state"
          mkdir -p "$OUT"

          DEPLOYER=0x00000000000004533Fe15556B1E086BB1A72cEae
          UPGRADE_SAFE=0xf36b9f50E59870A24F42F9Ba43b2aD0A4b8f2F51
          DEPLOYMENT_SAFE=0x8E5DE7118a596E99B0563D3022039c11927f4827
          MODULE=0x1CeC01DC0fFEE5eB5aF47DbEc1809F2A7c601C30
          ROLLBACK_SLOT=0x4910fdfa16fed3260ed0e7147f7cc6da11a60208b5b9406d12a635614ffd9143
          IMPL_SLOT=0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc
          ADMIN_SLOT=0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103
          PENDING_ADMIN_SLOT=0x6ed8ad4e485c433a46d43a225e2ebe6a14259468c9e0ee3a0c38eefca7d49f56

          cat > "$OUT/rpcs.tsv" <<'EOF'
          drpc	https://eth.drpc.org
          blockscout	https://eth.blockscout.com/api/eth-rpc
          llama	https://eth.llamarpc.com
          mevblocker	https://rpc.mevblocker.io
          onerpc	https://1rpc.io/eth
          EOF

          : > "$OUT/raw.tsv"
          while IFS=$'\t' read -r name rpc; do
            chain=$(cast chain-id --rpc-url "$rpc" 2>/dev/null || true)
            head=$(cast block-number --rpc-url "$rpc" 2>/dev/null || true)
            printf '%s\tchain_id\t%s\n%s\thead\t%s\n' "$name" "$chain" "$name" "$head" >> "$OUT/raw.tsv"
            [ "$chain" = "1" ] || continue

            call() {
              local label=$1 target=$2 sig=$3; shift 3
              local value
              value=$(cast call "$target" "$sig" "$@" --rpc-url "$rpc" 2>&1 || true)
              value=${value//$'\n'/ }
              printf '%s\t%s\t%s\n' "$name" "$label" "$value" >> "$OUT/raw.tsv"
            }
            storage() {
              local label=$1 target=$2 slot=$3
              local value
              value=$(cast storage "$target" "$slot" --rpc-url "$rpc" 2>&1 || true)
              value=${value//$'\n'/ }
              printf '%s\t%s\t%s\n' "$name" "$label" "$value" >> "$OUT/raw.tsv"
            }
            codehash() {
              local label=$1 target=$2
              local value
              value=$(cast codehash "$target" --rpc-url "$rpc" 2>&1 || true)
              printf '%s\t%s\t%s\n' "$name" "$label" "$value" >> "$OUT/raw.tsv"
            }

            call deployer.owner "$DEPLOYER" 'owner()(address)'
            call deployer.pendingOwner "$DEPLOYER" 'pendingOwner()(address)'
            call deployer.implementation "$DEPLOYER" 'implementation()(address)'
            call deployer.version "$DEPLOYER" 'version()(string)'
            storage deployer.impl_slot "$DEPLOYER" "$IMPL_SLOT"
            storage deployer.version_slot "$DEPLOYER" "$ROLLBACK_SLOT"
            storage deployer.admin_slot "$DEPLOYER" "$ADMIN_SLOT"
            storage deployer.pending_admin_slot "$DEPLOYER" "$PENDING_ADMIN_SLOT"
            codehash deployer.codehash "$DEPLOYER"

            for feature in 2 3 4 5; do
              call feature.$feature.authorized "$DEPLOYER" 'authorized(uint128)(address,uint40)' "$feature"
              call feature.$feature.ownerOf "$DEPLOYER" 'ownerOf(uint256)(address)' "$feature"
              call feature.$feature.prev "$DEPLOYER" 'prev(uint128)(address)' "$feature"
              call feature.$feature.next "$DEPLOYER" 'next(uint128)(address)' "$feature"
            done

            for safe_kind in upgrade deployment; do
              if [ "$safe_kind" = upgrade ]; then safe=$UPGRADE_SAFE; else safe=$DEPLOYMENT_SAFE; fi
              codehash safe.$safe_kind.codehash "$safe"
              call safe.$safe_kind.owners "$safe" 'getOwners()(address[])'
              call safe.$safe_kind.threshold "$safe" 'getThreshold()(uint256)'
              call safe.$safe_kind.nonce "$safe" 'nonce()(uint256)'
              call safe.$safe_kind.guard "$safe" 'getGuard()(address)'
              call safe.$safe_kind.fallback "$safe" 'getFallbackHandler()(address)'
              call safe.$safe_kind.modules "$safe" 'getModulesPaginated(address,uint256)(address[],address)' 0x0000000000000000000000000000000000000001 20
              call safe.$safe_kind.module_enabled "$safe" 'isModuleEnabled(address)(bool)' "$MODULE"
            done
            codehash module.codehash "$MODULE"
            call module.safe "$MODULE" 'safe()(address)'
          done < "$OUT/rpcs.tsv"

          python3 - "$OUT" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          rows=[]
          for line in (root/'raw.tsv').read_text().splitlines():
              rpc,label,value=line.split('\t',2)
              rows.append({'rpc':rpc,'label':label,'value':value})
          by_label={}
          for row in rows:
              by_label.setdefault(row['label'],{})[row['rpc']]=row['value']
          consensus={}
          disagreements=[]
          for label,values in sorted(by_label.items()):
              meaningful=[v for v in values.values() if v and 'error' not in v.lower()]
              agreed=meaningful[0] if meaningful and all(v==meaningful[0] for v in meaningful) else None
              consensus[label]={'value':agreed,'rpc_values':values}
              if meaningful and agreed is None:
                  disagreements.append(label)
          result={
              'deployer':'0x00000000000004533Fe15556B1E086BB1A72cEae',
              'upgrade_safe':'0xf36b9f50E59870A24F42F9Ba43b2aD0A4b8f2F51',
              'deployment_safe':'0x8E5DE7118a596E99B0563D3022039c11927f4827',
              'rollback_module':'0x1CeC01DC0fFEE5eB5aF47DbEc1809F2A7c601C30',
              'consensus':consensus,
              'disagreements':disagreements,
          }
          (root/'summary.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          if len([x for x in by_label.get('chain_id',{}).values() if x=='1']) < 3:
              raise SystemExit('fewer than three working Ethereum RPCs')
          required=['deployer.owner','deployer.pendingOwner','deployer.implementation','deployer.version']
          missing=[x for x in required if consensus.get(x,{}).get('value') is None]
          if missing:
              raise SystemExit(f'missing consensus: {missing}')
          PY

          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test -s "$OUT/summary.json"

      - name: Upload read-only control-state evidence
        uses: actions/upload-artifact@v4
        with:
          name: 0x-deployer-control-state-${{ github.run_id }}
          path: deployer-control-state/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
