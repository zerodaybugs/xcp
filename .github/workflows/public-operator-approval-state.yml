name: Collect public operator approval state

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/public-operator-approval-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ethereum:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query exact ApprovalForAll events targeting AllowanceHolder
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/public-state"
          mkdir -p "$OUT"
          URL='https://eth.blockscout.com/api?module=logs&action=getLogs&fromBlock=0&toBlock=latest&topic0=0x17307eab39ab6107e8899845ad3d59bd9653f200f220920489ca2b5937696c31&topic2=0x000000000000000000000000000000000000000000001ff3684f28c67538d4d072c22734&topic0_2_opr=and&page=1&offset=1000'
          printf '%s\n' "$URL" > "$OUT/query-url.txt"
          curl -fsSL --retry 5 --retry-all-errors --max-time 120 "$URL" > "$OUT/raw.json"
          python3 - "$OUT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          obj = json.loads((root / 'raw.json').read_text())
          result = obj.get('result', []) if isinstance(obj, dict) else []
          if isinstance(result, str):
              rows = [] if 'no logs' in result.lower() or 'no records' in result.lower() else None
          elif isinstance(result, list):
              rows = result
          else:
              rows = None
          if rows is None:
              raise SystemExit(f'unexpected Blockscout response: {obj!r}')
          summary = {
              'status': obj.get('status'),
              'message': obj.get('message'),
              'event_count': len(rows),
              'events': rows,
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'event_count': len(rows), 'message': obj.get('message')}, sort_keys=True))
          PY
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test -s "$OUT/summary.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-operator-approval-state-${{ github.run_id }}
          path: public-state/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 9
