name: Collect public operator approval state

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/public-operator-approval-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - {shard: '00', start: 19500000, end: 19887499}
          - {shard: '01', start: 19887500, end: 20274999}
          - {shard: '02', start: 20275000, end: 20662499}
          - {shard: '03', start: 20662500, end: 21049999}
          - {shard: '04', start: 21050000, end: 21437499}
          - {shard: '05', start: 21437500, end: 21824999}
          - {shard: '06', start: 21825000, end: 22212499}
          - {shard: '07', start: 22212500, end: 22599999}
          - {shard: '08', start: 22600000, end: 22987499}
          - {shard: '09', start: 22987500, end: 23374999}
          - {shard: '10', start: 23375000, end: 23762499}
          - {shard: '11', start: 23762500, end: 24149999}
          - {shard: '12', start: 24150000, end: 24537499}
          - {shard: '13', start: 24537500, end: 24924999}
          - {shard: '14', start: 24925000, end: 25312499}
          - {shard: '15', start: 25312500, end: 25700000}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Scan exact multi-token authorities for AllowanceHolder
        env:
          SHARD: ${{ matrix.shard }}
          START_BLOCK: ${{ matrix.start }}
          END_BLOCK: ${{ matrix.end }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/operator-state-$SHARD"
          mkdir -p "$OUT"
          python3 - "$OUT" <<'PY'
          import json, os, pathlib, sys, time, urllib.error, urllib.request

          out = pathlib.Path(sys.argv[1])
          shard = os.environ['SHARD']
          start = int(os.environ['START_BLOCK'])
          configured_end = int(os.environ['END_BLOCK'])
          operator = '0x0000000000001ff3684f28c67538d4d072c22734'
          operator_topic = '0x' + '0' * 24 + operator[2:]
          assert len(operator_topic) == 66
          event_topics = {
              'ERC1155_ApprovalForAll': '0x17307eab39ab6107e8899845ad3d59bd9653f200f220920489ca2b5937696c31',
              'ERC6909_OperatorSet': '0xceb576d9f15e4e200fdb5096d64d5dfd667e16def20c1eefd14256d8e3faa267',
              'ERC6909_Approval': '0xb3fd5071835887567a0671151121894ddccc2842f1d10bedad13e0d17cace9a7',
          }
          rpcs = [
              'https://eth.blockscout.com/api/eth-rpc',
              'https://eth.drpc.org',
              'https://eth.llamarpc.com',
              'https://rpc.mevblocker.io',
              'https://1rpc.io/eth',
          ]
          rid = 0

          def one_rpc(url, method, params, timeout=45):
              global rid
              rid += 1
              body = json.dumps({'jsonrpc':'2.0','id':rid,'method':method,'params':params}).encode()
              req = urllib.request.Request(
                  url,
                  data=body,
                  headers={'Content-Type':'application/json','User-Agent':'0x-public-authority-scan/3.0'},
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      obj = json.load(response)
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(errors='replace')
                  raise RuntimeError({'http_status':exc.code,'body':raw[:600]}) from exc
              if 'error' in obj:
                  raise RuntimeError(obj['error'])
              return obj['result']

          def rpc(method, params, attempts=2):
              errors = []
              for url in rpcs:
                  for attempt in range(attempts):
                      try:
                          return one_rpc(url, method, params), url
                      except Exception as exc:
                          errors.append({'rpc':url,'attempt':attempt,'error':repr(exc)})
                          time.sleep(0.5 + attempt)
              raise RuntimeError({'method':method,'errors':errors})

          head_raw, head_rpc = rpc('eth_blockNumber', [])
          head = int(head_raw,16)
          state_block = max(0, head - 32)
          end = min(configured_end, state_block)

          logs = []
          ranges = []
          gaps = []
          for kind, topic0 in event_topics.items():
              cursor = start
              chunk = 5_000
              while cursor <= end:
                  stop = min(end, cursor + chunk - 1)
                  query = {
                      'fromBlock':hex(cursor),
                      'toBlock':hex(stop),
                      'topics':[topic0, None, operator_topic],
                  }
                  try:
                      batch, used_rpc = rpc('eth_getLogs',[query],attempts=2)
                  except Exception as exc:
                      if chunk > 250:
                          chunk = max(250, chunk // 2)
                          continue
                      gaps.append({'kind':kind,'from':cursor,'to':stop,'error':repr(exc)})
                      cursor = stop + 1
                      continue
                  for row in batch:
                      row['_kind'] = kind
                  logs.extend(batch)
                  ranges.append({'kind':kind,'from':cursor,'to':stop,'count':len(batch),'rpc':used_rpc})
                  cursor = stop + 1
                  if not batch and chunk < 10_000:
                      chunk = min(10_000,chunk*2)

          def addr(topic): return '0x' + topic[-40:].lower()
          def word(address): return '0' * 24 + address[2:].lower()
          def call(to, data):
              try:
                  return rpc('eth_call',[{'to':to,'data':data},hex(state_block)],attempts=2)[0]
              except Exception as exc:
                  return {'error':repr(exc)}
          def uint(raw):
              try: return int(raw,16) if isinstance(raw,str) else None
              except Exception: return None

          events = []
          for log in logs:
              topics = log.get('topics',[])
              if len(topics) < 3:
                  continue
              data_value = uint(log.get('data','0x'))
              token_id = int(topics[3],16) if log['_kind'] == 'ERC6909_Approval' and len(topics)>3 else None
              events.append({
                  'kind':log['_kind'],
                  'token':log['address'].lower(),
                  'owner':addr(topics[1]),
                  'operator':addr(topics[2]),
                  'token_id':token_id,
                  'event_value':data_value,
                  'block':int(log['blockNumber'],16),
                  'tx_hash':log.get('transactionHash'),
                  'log_index':int(log.get('logIndex','0x0'),16),
              })
          events.sort(key=lambda row:(row['block'],row['log_index']))
          latest = {}
          for event in events:
              key = (event['kind'],event['token'],event['owner'],event.get('token_id'))
              latest[key] = event

          checked = []
          active = []
          for event in latest.values():
              token = event['token']
              owner = event['owner']
              kind = event['kind']
              current_raw = None
              current_value = None
              if kind == 'ERC1155_ApprovalForAll':
                  current_raw = call(token,'0xe985e9c5'+word(owner)+word(operator))
                  current_value = uint(current_raw)
              elif kind == 'ERC6909_OperatorSet':
                  current_raw = call(token,'0xb6363cf2'+word(owner)+word(operator))
                  current_value = uint(current_raw)
              else:
                  current_raw = call(
                      token,
                      '0x598af9e7'+word(owner)+word(operator)+hex(event['token_id'])[2:].rjust(64,'0')
                  )
                  current_value = uint(current_raw)

              erc1155_raw = call(token,'0x01ffc9a7'+'d9b67a26'+'0'*56)
              erc6909_raw = call(token,'0x01ffc9a7'+'0f632fb3'+'0'*56)
              row = {
                  **event,
                  'current_raw':current_raw,
                  'current_value':current_value,
                  'active_now':current_value not in (None,0),
                  'erc1155':uint(erc1155_raw) not in (None,0),
                  'erc6909':uint(erc6909_raw) not in (None,0),
                  'erc1155_raw':erc1155_raw,
                  'erc6909_raw':erc6909_raw,
              }
              checked.append(row)
              if row['active_now']:
                  active.append(row)

          summary = {
              'shard':shard,
              'configured_start':start,
              'configured_end':configured_end,
              'scanned_end':end,
              'head':head,
              'head_rpc':head_rpc,
              'state_block':state_block,
              'range_count':len(ranges),
              'gap_count':len(gaps),
              'event_count':len(events),
              'unique_authority_count':len(latest),
              'active_authority_count':len(active),
              'active_authorities':active,
          }
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (out/'events.json').write_text(json.dumps(events,indent=2,sort_keys=True)+'\n')
          (out/'checked.json').write_text(json.dumps(checked,indent=2,sort_keys=True)+'\n')
          (out/'ranges.json').write_text(json.dumps(ranges,indent=2,sort_keys=True)+'\n')
          (out/'gaps.json').write_text(json.dumps(gaps,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'shard':shard,
              'events':len(events),
              'active':len(active),
              'gaps':len(gaps),
              'scanned':[start,end],
          },sort_keys=True))
          if gaps:
              raise SystemExit(f'incomplete scan: {len(gaps)} gaps')
          PY
          find "$OUT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"
          test -s "$OUT/summary.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-authority-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: operator-state-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 9
