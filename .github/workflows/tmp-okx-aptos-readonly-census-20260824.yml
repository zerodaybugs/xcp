name: Temporary OKX Aptos read-only census 2026-08-24

on:
  pull_request:
    branches:
      - master
    paths:
      - .tmp/okx-aptos-census-trigger-20260824.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query public Aptos mainnet state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.parse, urllib.request

          root = pathlib.Path('artifact')
          rpc = 'https://fullnode.mainnet.aptoslabs.com/v1'
          indexer = 'https://api.mainnet.aptoslabs.com/v1/graphql'
          package = '0xd7ed3ceeb92c4e5a413e8ad7fab83ced12bf4141a49248a91b5485cb45a0ef4b'
          deployer = '0x14b2864b0df3553a864dc8560925309ff05bde4dec5a731b54e6f3cee541ef91'
          resource_type = package + '::proxy::ResourceAccount'

          def get_json(url, retries=5):
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'readonly-state-census'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** attempt)
              raise last

          def post_graphql(query, variables, retries=5):
              body = json.dumps({'query': query, 'variables': variables}).encode()
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(
                          indexer,
                          data=body,
                          headers={'Content-Type':'application/json','User-Agent':'readonly-state-census'},
                          method='POST',
                      )
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** attempt)
              raise last

          ledger = get_json(rpc)
          (root / 'ledger.json').write_text(json.dumps(ledger, indent=2) + '\n')
          modules = get_json(f'{rpc}/accounts/{package}/modules')
          (root / 'package-modules.json').write_text(json.dumps(modules, indent=2) + '\n')
          encoded = urllib.parse.quote(resource_type, safe='')
          resource = get_json(f'{rpc}/accounts/{deployer}/resource/{encoded}')
          (root / 'deployer-resource-account.json').write_text(json.dumps(resource, indent=2) + '\n')
          escrow = resource['data']['signer_cap']['account']
          (root / 'escrow-address.txt').write_text(escrow + '\n')
          resources = get_json(f'{rpc}/accounts/{escrow}/resources')
          (root / 'escrow-resources.json').write_text(json.dumps(resources, indent=2) + '\n')
          txs = get_json(f'{rpc}/accounts/{escrow}/transactions?limit=100')
          (root / 'escrow-transactions-latest100.json').write_text(json.dumps(txs, indent=2) + '\n')

          balance_query = '''query($owner: String!) {
            current_fungible_asset_balances(
              where: {owner_address: {_eq: $owner}, amount: {_gt: "0"}}
              order_by: {amount: desc}
              limit: 500
            ) {
              owner_address asset_type amount storage_id is_primary is_frozen
              last_transaction_version last_transaction_timestamp
            }
          }'''
          object_query = '''query($owner: String!) {
            current_objects(where: {owner_address: {_eq: $owner}, is_deleted: {_eq: false}}, limit: 500) {
              object_address object_type owner_address state_key_hash last_transaction_version
            }
          }'''
          balances = post_graphql(balance_query, {'owner': escrow})
          objects = post_graphql(object_query, {'owner': escrow})
          (root / 'escrow-fungible-balances.json').write_text(json.dumps(balances, indent=2) + '\n')
          (root / 'escrow-owned-objects.json').write_text(json.dumps(objects, indent=2) + '\n')

          summary = {
              'ledger_version': ledger.get('ledger_version'),
              'ledger_timestamp': ledger.get('ledger_timestamp'),
              'package': package,
              'deployer': deployer,
              'resource_account': escrow,
              'module_names': [m.get('abi', {}).get('name') for m in modules],
              'module_bytecode_sha256': {
                  m.get('abi', {}).get('name', f'unknown-{i}'): hashlib.sha256(bytes.fromhex(m.get('bytecode','0x')[2:])).hexdigest()
                  for i, m in enumerate(modules)
              },
              'coin_stores': [
                  {'type': item.get('type'), 'value': item.get('data',{}).get('coin',{}).get('value')}
                  for item in resources if '::coin::CoinStore<' in item.get('type','')
              ],
              'fungible_balances_response': balances,
              'owned_objects_response': objects,
              'latest_transaction_count': len(txs),
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY

          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: okx-aptos-readonly-census
          path: artifact
          retention-days: 1
          if-no-files-found: error
