name: Temporary OKX Aptos read-only census 2026-08-24

on:
  pull_request:
    branches:
      - master
    paths:
      - .tmp/okx-aptos-census-trigger-20260824.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query public Aptos mainnet state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.parse, urllib.request

          root = pathlib.Path('artifact')
          rpc = 'https://fullnode.mainnet.aptoslabs.com/v1'
          package = '0xd7ed3ceeb92c4e5a413e8ad7fab83ced12bf4141a49248a91b5485cb45a0ef4b'
          deployer = '0x14b2864b0df3553a864dc8560925309ff05bde4dec5a731b54e6f3cee541ef91'
          resource_type = package + '::proxy::ResourceAccount'

          def get_json(url, retries=5):
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'authorized-readonly-security-research'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return json.loads(response.read().decode())
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** attempt)
              raise last

          ledger = get_json(rpc)
          (root / 'ledger.json').write_text(json.dumps(ledger, indent=2) + '\n')

          modules = get_json(f'{rpc}/accounts/{package}/modules')
          (root / 'package-modules.json').write_text(json.dumps(modules, indent=2) + '\n')

          encoded = urllib.parse.quote(resource_type, safe='')
          resource = get_json(f'{rpc}/accounts/{deployer}/resource/{encoded}')
          (root / 'deployer-resource-account.json').write_text(json.dumps(resource, indent=2) + '\n')

          data = resource.get('data', {})
          cap = data.get('signer_cap', {}) if isinstance(data, dict) else {}
          candidates = []
          if isinstance(cap, dict):
              for key in ('account', 'account_address', 'addr'):
                  if cap.get(key):
                      candidates.append(cap[key])
          if isinstance(cap, str):
              candidates.append(cap)
          if not candidates:
              def walk(value):
                  if isinstance(value, dict):
                      for key, child in value.items():
                          if key in ('account', 'account_address', 'addr') and isinstance(child, str) and child.startswith('0x'):
                              candidates.append(child)
                          walk(child)
                  elif isinstance(value, list):
                      for child in value: walk(child)
              walk(resource)
          if not candidates:
              raise SystemExit('resource account address not found in signer capability')
          escrow = candidates[0]
          if not escrow.startswith('0x'):
              escrow = '0x' + escrow
          (root / 'escrow-address.txt').write_text(escrow + '\n')

          resources = get_json(f'{rpc}/accounts/{escrow}/resources')
          (root / 'escrow-resources.json').write_text(json.dumps(resources, indent=2) + '\n')

          txs = get_json(f'{rpc}/accounts/{escrow}/transactions?limit=100')
          (root / 'escrow-transactions-latest100.json').write_text(json.dumps(txs, indent=2) + '\n')

          summary = {
              'ledger_version': ledger.get('ledger_version'),
              'ledger_timestamp': ledger.get('ledger_timestamp'),
              'package': package,
              'deployer': deployer,
              'resource_account': escrow,
              'module_names': [m.get('abi', {}).get('name') for m in modules],
              'module_bytecode_sha256': {
                  m.get('abi', {}).get('name', f'unknown-{i}'): hashlib.sha256(bytes.fromhex(m.get('bytecode','0x')[2:])).hexdigest()
                  for i, m in enumerate(modules)
              },
              'coin_stores': [],
              'other_asset_resources': [],
              'latest_transaction_count': len(txs),
          }
          for item in resources:
              typ = item.get('type','')
              data = item.get('data',{})
              if '::coin::CoinStore<' in typ:
                  summary['coin_stores'].append({
                      'type': typ,
                      'value': data.get('coin',{}).get('value'),
                      'frozen': data.get('frozen'),
                  })
              if any(term in typ.lower() for term in ('fungible', 'primary', 'store', 'object')):
                  summary['other_asset_resources'].append({'type': typ, 'data': data})
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY

          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: okx-aptos-readonly-census
          path: artifact
          retention-days: 1
          if-no-files-found: error
