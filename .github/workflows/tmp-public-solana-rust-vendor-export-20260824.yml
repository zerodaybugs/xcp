name: Temporary public Solana Rust vendor export 2026-08-24

on:
  pull_request:
    branches:
      - master
    paths:
      - .tmp/solana-rust-vendor-export-trigger-20260824.txt

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.85.1

      - name: Clone pinned public source and vendor dependencies
        shell: bash
        run: |
          set -euo pipefail
          commit='677d3eced859d12629e354eb320ab301710002e5'
          git clone --filter=blob:none https://github.com/okxlabs/Web3-DEX-Router-Solana-V1.git source
          git -C source checkout --detach "$commit"
          test "$(git -C source rev-parse HEAD)" = "$commit"
          mkdir -p source/.cargo artifact
          cd source
          cargo vendor --locked vendor > .cargo/config.toml
          cargo metadata --offline --locked --format-version 1 > ../artifact/cargo-metadata.json
          cargo test --offline --locked -p dex-solana --lib --no-run
          cd ..
          rm -rf source/target
          printf '%s\n' "$commit" > artifact/source-commit.txt
          rustc --version > artifact/rustc-version.txt
          cargo --version > artifact/cargo-version.txt

      - name: Package portable toolchain and complete vendored source
        shell: bash
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot)"
          printf '%s\n' "$sysroot" > artifact/original-sysroot.txt
          tar -I 'zstd -12 -T0' -cf artifact/rust-toolchain-1.85.1-linux-x86_64.tar.zst -C "$(dirname "$sysroot")" "$(basename "$sysroot")"
          tar -I 'zstd -12 -T0' -cf artifact/okx-solana-router-pinned-vendored-source.tar.zst \
            --exclude='.git' -C . source
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt

      - name: Upload public toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-rust-1.85.1-okx-solana-vendored-source
          path: artifact
          retention-days: 1
          if-no-files-found: error
